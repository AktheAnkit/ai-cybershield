<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CyberShield{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #e2e8f0; }
    .navbar, .card { background-color: #1e293b !important; }
    .card { border: 1px solid #334155; }
    a { color: #38bdf8; }
    .badge-critical { background-color: #dc2626; }
    .badge-high { background-color: #ea580c; }
    .badge-medium { background-color: #ca8a04; }
    .badge-low { background-color: #0891b2; }
    .badge-info { background-color: #64748b; }
    .badge-ok { background-color: #16a34a; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">CyberShield</a>
      <div class="navbar-nav ms-auto d-flex flex-row gap-3">
        {% if user %}
          <a class="nav-link" href="/tools/password">Password</a>
          <a class="nav-link" href="/tools/ssl">SSL</a>
          <a class="nav-link" href="/tools/headers">Headers</a>
          <a class="nav-link" href="/tools/website">Website</a>
          <a class="nav-link" href="/tools/phishing">Phishing</a>
          <a class="nav-link fw-bold" href="/tools/advisor">AI Advisor</a>
          <a class="nav-link" href="/logout">Logout ({{ user.username }})</a>
        {% else %}
          <a class="nav-link" href="/login">Login</a>
          <a class="nav-link" href="/register">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
